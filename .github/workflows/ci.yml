name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Validate ledger, snapshot, and changelog
        run: ai-model-ledger check
      - name: History is append-only relative to the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          ai-model-ledger check-history --against origin/${{ github.base_ref }}
      - name: Site builds
        run: ai-model-ledger build --out site
