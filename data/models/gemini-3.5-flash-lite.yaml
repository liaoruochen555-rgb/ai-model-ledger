notes_zh: 标准档缓存存储在同一单元格写着每百万 tokens 每小时 1.00 美元，那是存储价，不是输入价。页面没有给出限期涨价，所以没有 scheduled。这是 Gemini 目录里的低价档，用来和 Gemini 4 Argon 对照。
